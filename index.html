<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Stock Take</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; max-width: 500px; margin: auto; }
    h2 { margin-bottom: 4px; }
    #siteBadge { font-size: 16px; font-weight: bold; color: #1a73e8; margin-bottom: 14px; }
    .mode-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
    .mode-btn { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: 2px solid #ccc; border-radius: 6px; background: #f5f5f5; color: #333; cursor: pointer; }
    .mode-btn.active-remove { background: #d93025; color: white; border-color: #d93025; }
    .mode-btn.active-add { background: #188038; color: white; border-color: #188038; }
    #reader { width: 100%; margin-bottom: 15px; border-radius: 8px; overflow: hidden; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #ddd; }
    input[type="number"] { width: 65px; padding: 8px; font-size: 16px; }
    input[type="text"], #submitBtn { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; box-sizing: border-box; }
    #submitBtn { background: #d93025; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #submitBtn.add-mode { background: #188038; }
    #submitBtn:disabled { background: #ccc; }
    #status { font-size: 14px; color: #555; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2 id="pageTitle">Remove Stock</h2>
  <div id="siteBadge">Location: Loading...</div>

  <!-- Action Mode Selector -->
  <div class="mode-toggle">
    <button type="button" id="btnRemove" class="mode-btn active-remove" onclick="setMode('Removed')">− Take Out</button>
    <button type="button" id="btnAdd" class="mode-btn" onclick="setMode('Added')">+ Put Back</button>
  </div>

  <div id="status">Loading inventory list...</div>
  <div id="reader"></div>
  <div id="cart"></div>
  
  <input type="text" id="staffName" placeholder="Your Name" required>
  <button onclick="sendData()" id="submitBtn">Submit Removed Stock</button>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW:
    const API_URL = 'https://script.google.com/macros/s/AKfycbxV-rQU2N0fLiJdzQFjUoE66TVsyUCBGN_6_xLfSVCL9-ie5bIvcZ8xdQ_5JiKTVfEKQw/exec';

    // Map short URL codes (and Sheet tab names) to full display names
    const siteNames = {
      'Site-A': 'Middlesex House, London',
      'Site-B': 'Carlton House Terrace, London',
      'Site-C': 'The Smith Centre, Henley'
    };

    // Read ?site=SheetName from the QR code URL
    const urlParams = new URLSearchParams(window.location.search);
    const currentSite = urlParams.get('site') || 'Log';
    const displaySiteName = siteNames[currentSite] || currentSite;
    document.getElementById('siteBadge').innerText = 'Location: ' + displaySiteName;

    let inventory = {};
    let cart = {};
    let lastScanTime = 0;
    let currentMode = 'Removed';

    function setMode(mode) {
      currentMode = mode;
      const btnRemove = document.getElementById('btnRemove');
      const btnAdd = document.getElementById('btnAdd');
      const submitBtn = document.getElementById('submitBtn');
      const pageTitle = document.getElementById('pageTitle');

      if (mode === 'Removed') {
        btnRemove.className = 'mode-btn active-remove';
        btnAdd.className = 'mode-btn';
        submitBtn.className = '';
        submitBtn.innerText = 'Submit Removed Stock';
        pageTitle.innerText = 'Remove Stock';
      } else {
        btnRemove.className = 'mode-btn';
        btnAdd.className = 'mode-btn active-add';
        submitBtn.className = 'add-mode';
        submitBtn.innerText = 'Submit Returned Stock';
        pageTitle.innerText = 'Return / Add Stock';
      }
    }

    // 1. Load Inventory Map via JSONP (bypasses CORS/redirect blocks)
    window.handleInventory = function(data) {
      Object.keys(data).forEach(key => {
        inventory[key.trim().toUpperCase()] = data[key];
      });
      document.getElementById('status').innerText = 'Ready to scan.';
    };

    const script = document.createElement('script');
    script.src = API_URL + '?callback=handleInventory';
    script.onerror = function() {
      document.getElementById('status').innerText = 'Error: Could not load item names.';
    };
    document.body.appendChild(script);

    // 2. Handle Camera Scans
    function onScanSuccess(decodedText) {
      const now = Date.now();
      if (now - lastScanTime < 1500) return;
      lastScanTime = now;

      const id = decodedText.trim();
      const lookupKey = id.toUpperCase();
      if (cart[id]) {
        cart[id].qty += 1;
      } else {
        cart[id] = { id: id, name: inventory[lookupKey] || 'Unknown Item', qty: 1 };
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart');
      container.innerHTML = '';
      Object.values(cart).forEach(item => {
        container.innerHTML += `
          <div class="item-row">
            <div><strong>${item.name}</strong></div>
            <input type="number" min="1" value="${item.qty}" onchange="cart['${item.id}'].qty = this.value">
          </div>`;
      });
    }

    // 3. Send Batch to Google Sheets
    function sendData() {
      const name = document.getElementById('staffName').value.trim();
      const items = Object.values(cart);
      if (!name || items.length === 0) return alert('Enter your name and scan at least one item.');
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          site: currentSite,
          staffName: name,
          action: currentMode,
          items: items
        })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === 'success') {
          alert('Stock logged to ' + displaySiteName + '!');
          cart = {};
          renderCart();
        } else {
          alert('Error saving data: ' + result.message);
        }
      })
      .catch(err => {
        alert('Network error. Please try again.');
        console.error(err);
      })
      .finally(() => {
        btn.disabled = false;
        setMode(currentMode);
      });
    }

    // 4. Start Rear-Facing Camera Automatically
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById('status').innerText = 'Camera error: ' + err;
    });
  </script>
</body>
</html>
